<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MARS - Animated Title</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Space Grotesk', sans-serif;
        }

        /* ===== Ambient Background ===== */
        .ambient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0;
            animation: orbFadeIn 2s ease forwards, orbFloat 18s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            top: -15%;
            left: -10%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, transparent 70%);
            animation-delay: 0s, 0s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            bottom: -15%;
            right: -10%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.25) 0%, transparent 70%);
            animation-delay: 0.5s, 0.5s;
        }

        .orb-3 {
            width: 400px;
            height: 400px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
            animation-delay: 1s, 1s;
        }

        @keyframes orbFadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(40px, -30px) scale(1.15);
            }
        }

        /* ===== Particle Canvas ===== */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* ===== Main Container ===== */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        /* ===== Top Label ===== */
        .top-label {
            font-family: 'Manrope', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: rgba(148, 163, 184, 0);
            margin-bottom: 2rem;
            transition: color 1s ease;
        }

        .top-label.visible {
            color: rgba(148, 163, 184, 0.7);
        }

        /* ===== MARS Letters ===== */
        .mars-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.08em;
            margin-bottom: 2.5rem;
            position: relative;
        }

        .mars-letter {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(6rem, 15vw, 14rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #e2e8f0, #94a3b8, #64748b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: translateY(60px) scale(0.7) rotateX(40deg);
            display: inline-block;
            animation: letterReveal 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            filter: blur(8px);
        }

        .mars-letter:nth-child(1) {
            animation-delay: 0.6s;
        }

        .mars-letter:nth-child(2) {
            animation-delay: 0.8s;
        }

        .mars-letter:nth-child(3) {
            animation-delay: 1.0s;
        }

        .mars-letter:nth-child(4) {
            animation-delay: 1.2s;
        }

        @keyframes letterReveal {
            0% {
                opacity: 0;
                transform: translateY(60px) scale(0.7) rotateX(40deg);
                filter: blur(8px);
            }

            60% {
                opacity: 1;
                filter: blur(2px);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotateX(0deg);
                filter: blur(0px);
            }
        }

        /* ===== Glow Pulse on Letters ===== */
        .mars-letter::after {
            content: attr(data-letter);
            position: absolute;
            top: 0;
            left: 0;
            font-family: inherit;
            font-size: inherit;
            font-weight: inherit;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            animation: glowPulse 3s ease-in-out infinite;
            animation-delay: 2.5s;
            z-index: -1;
            filter: blur(12px);
        }

        .mars-letter:nth-child(1)::after {
            animation-delay: 2.5s;
        }

        .mars-letter:nth-child(2)::after {
            animation-delay: 2.7s;
        }

        .mars-letter:nth-child(3)::after {
            animation-delay: 2.9s;
        }

        .mars-letter:nth-child(4)::after {
            animation-delay: 3.1s;
        }

        @keyframes glowPulse {

            0%,
            100% {
                opacity: 0;
            }

            50% {
                opacity: 0.6;
            }
        }

        /* ===== Divider Line ===== */
        .divider {
            width: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(148, 163, 184, 0.5), transparent);
            margin-bottom: 2rem;
            animation: dividerExpand 1s ease forwards;
            animation-delay: 2s;
        }

        @keyframes dividerExpand {
            to {
                width: min(500px, 80vw);
            }
        }

        /* ===== Subtitle Words ===== */
        .subtitle {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.4em;
            perspective: 600px;
        }

        .subtitle-word {
            font-family: 'Manrope', sans-serif;
            font-size: clamp(1rem, 2.5vw, 1.75rem);
            font-weight: 400;
            letter-spacing: 0.05em;
            opacity: 0;
            transform: translateY(20px);
            animation: wordFadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .subtitle-word.highlight {
            font-weight: 600;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle-word.normal {
            color: rgba(148, 163, 184, 0.8);
        }

        .subtitle-word.ampersand {
            color: rgba(100, 116, 139, 0.6);
            font-weight: 300;
        }

        .subtitle-word:nth-child(1) {
            animation-delay: 2.4s;
        }

        .subtitle-word:nth-child(2) {
            animation-delay: 2.6s;
        }

        .subtitle-word:nth-child(3) {
            animation-delay: 2.8s;
        }

        .subtitle-word:nth-child(4) {
            animation-delay: 3.0s;
        }

        .subtitle-word:nth-child(5) {
            animation-delay: 3.2s;
        }

        @keyframes wordFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Bottom Tagline ===== */
        .tagline {
            font-family: 'Manrope', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(100, 116, 139, 0);
            margin-top: 3rem;
            transition: color 1.2s ease;
        }

        .tagline.visible {
            color: rgba(100, 116, 139, 0.5);
        }

        /* ===== Scanning Line Effect ===== */
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.4), rgba(139, 92, 246, 0.4), transparent);
            z-index: 5;
            opacity: 0;
            animation: scanDown 2s ease-in-out forwards;
            animation-delay: 0.3s;
        }

        @keyframes scanDown {
            0% {
                top: 0;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        /* ===== Corner Accents ===== */
        .corner {
            position: fixed;
            width: 40px;
            height: 40px;
            z-index: 15;
            opacity: 0;
            animation: cornerFade 0.6s ease forwards;
            animation-delay: 3.5s;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: rgba(100, 116, 139, 0.3);
        }

        .corner-tl {
            top: 30px;
            left: 30px;
        }

        .corner-tl::before {
            top: 0;
            left: 0;
            width: 20px;
            height: 1px;
        }

        .corner-tl::after {
            top: 0;
            left: 0;
            width: 1px;
            height: 20px;
        }

        .corner-tr {
            top: 30px;
            right: 30px;
        }

        .corner-tr::before {
            top: 0;
            right: 0;
            width: 20px;
            height: 1px;
        }

        .corner-tr::after {
            top: 0;
            right: 0;
            width: 1px;
            height: 20px;
        }

        .corner-bl {
            bottom: 30px;
            left: 30px;
        }

        .corner-bl::before {
            bottom: 0;
            left: 0;
            width: 20px;
            height: 1px;
        }

        .corner-bl::after {
            bottom: 0;
            left: 0;
            width: 1px;
            height: 20px;
        }

        .corner-br {
            bottom: 30px;
            right: 30px;
        }

        .corner-br::before {
            bottom: 0;
            right: 0;
            width: 20px;
            height: 1px;
        }

        .corner-br::after {
            bottom: 0;
            right: 0;
            width: 1px;
            height: 20px;
        }

        @keyframes cornerFade {
            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <!-- Ambient Background -->
    <div class="ambient">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Particle Canvas -->
    <canvas id="particles"></canvas>

    <!-- Scan Line -->
    <div class="scan-line"></div>

    <!-- Corner Accents -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Main Content -->
    <div class="container">
        <div class="top-label" id="topLabel">Introducing</div>

        <div class="mars-title">
            <span class="mars-letter" data-letter="M">M</span>
            <span class="mars-letter" data-letter="A">A</span>
            <span class="mars-letter" data-letter="R">R</span>
            <span class="mars-letter" data-letter="S">S</span>
        </div>

        <div class="divider"></div>

        <div class="subtitle">
            <span class="subtitle-word highlight">Medical</span>
            <span class="subtitle-word highlight">Analysis</span>
            <span class="subtitle-word ampersand">&</span>
            <span class="subtitle-word highlight">Report</span>
            <span class="subtitle-word highlight">Summarizer</span>
        </div>

        <div class="tagline" id="tagline">Medgemma - Powered Medical Intelligence</div>
    </div>

    <script>
        // ===== Particle System =====
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.opacity = Math.random() * 0.4 + 0.1;
                this.pulseSpeed = Math.random() * 0.02 + 0.005;
                this.pulseOffset = Math.random() * Math.PI * 2;
            }
            update(time) {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
                this.currentOpacity = this.opacity * (0.5 + 0.5 * Math.sin(time * this.pulseSpeed + this.pulseOffset));
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(148, 163, 184, ${this.currentOpacity})`;
                ctx.fill();
            }
        }

        const particles = Array.from({ length: 80 }, () => new Particle());
        let startTime = Date.now();

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const time = (Date.now() - startTime) / 1000;
            particles.forEach(p => {
                p.update(time);
                p.draw();
            });

            // Draw subtle connecting lines
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(100, 116, 139, ${0.06 * (1 - dist / 120)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // ===== Timed reveals =====
        setTimeout(() => {
            document.getElementById('topLabel').classList.add('visible');
        }, 300);

        setTimeout(() => {
            document.getElementById('tagline').classList.add('visible');
        }, 4000);
    </script>

</body>

</html>
